<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141130" />
      <stop offset="50%" stop-color="#090817" />
      <stop offset="100%" stop-color="#05040d" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4DFF" />
      <stop offset="50%" stop-color="#D83C9D" />
      <stop offset="100%" stop-color="#E83E7A" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E83E7A" />
      <stop offset="50%" stop-color="#8B4DFF" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(139, 77, 255, 0.4)" stroke-width="8" />

  <!-- Ambient Glow behind camera -->
  <circle cx="256" cy="270" r="140" fill="#8B4DFF" opacity="0.25" filter="url(#glow)" />
  <circle cx="340" cy="180" r="60" fill="#E83E7A" opacity="0.3" filter="url(#glow)" />

  <!-- Camera Body Outer Ring / Stroke -->
  <rect x="100" y="148" width="312" height="236" rx="56" fill="none" stroke="url(#brandGrad)" stroke-width="20" stroke-linecap="round" />
  
  <!-- Camera Top Flash Notch -->
  <path d="M 196 148 L 216 116 Q 224 104 238 104 L 274 104 Q 288 104 296 116 L 316 148" fill="none" stroke="url(#brandGrad)" stroke-width="20" stroke-linejoin="round" />

  <!-- Camera Lens Outer Circle -->
  <circle cx="256" cy="266" r="74" fill="#0C0A20" stroke="url(#brandGrad)" stroke-width="18" />
  
  <!-- Inner Lens Aperture Ring -->
  <circle cx="256" cy="266" r="44" fill="none" stroke="url(#lensGrad)" stroke-width="10" />

  <!-- Glowing Lens Pupil -->
  <circle cx="256" cy="266" r="22" fill="url(#brandGrad)" />
  <circle cx="264" cy="258" r="7" fill="#FFFFFF" opacity="0.85" />

  <!-- Flash Strobe Dot -->
  <circle cx="350" cy="195" r="14" fill="#00F5D4" />
  
  <!-- Sparkle top-right -->
  <path d="M 390 100 Q 405 100 405 85 Q 405 100 420 100 Q 405 100 405 115 Q 405 100 390 100" fill="#E83E7A" />
</svg>
